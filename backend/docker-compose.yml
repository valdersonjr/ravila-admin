version: "3.9"

networks:
  ravilas_net:
    driver: bridge

volumes:
  uploads_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ravilas_net
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
